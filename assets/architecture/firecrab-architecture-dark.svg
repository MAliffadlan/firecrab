<svg xmlns="http://www.w3.org/2000/svg" aria-label="Firecrab architecture in five stacked layers, read top to bottom. External layer, outside the host: the firecrab-frontend dashboard, firecrab-cli, REST clients, and an image registry holding OCI or M2Image sources. Control layer: firecrab-api, the unprivileged hub every path crosses. Network layer: firecrab-helper, the only privileged capability-bounded process, which provisions MicroNetwork. Runtime layer: identical Firecracker guest microVMs, N of them. Storage layer: MicroStorage on the host disk, holding VM images as kernels and root filesystems, one writable disk per VM, and the state of which VMs and networks exist." role="img" viewBox="0 0 1140 880"><defs><marker id="arrow" markerHeight="6.5" markerWidth="6.5" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#A08B7A" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="arrow-accent" markerHeight="6.5" markerWidth="6.5" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#F0824B" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect width="1140" height="880" x="0" y="0" fill="#14100E"/><rect width="960" height="700" x="100" y="150" fill="#221A15" stroke="#5C4C3F" stroke-dasharray="7 6" stroke-width="2" rx="10"/><text x="120" y="173" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="start">FIRECRAB HOST</text><line x1="84" x2="1060" y1="184" y2="184" stroke="#5C4C3F" stroke-width="1"/><line x1="84" x2="1060" y1="322" y2="322" stroke="#5C4C3F" stroke-width="1"/><line x1="84" x2="1060" y1="472" y2="472" stroke="#5C4C3F" stroke-width="1"/><line x1="84" x2="1060" y1="702" y2="702" stroke="#5C4C3F" stroke-width="1"/><text x="76" y="80" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.6" text-anchor="end">EXTERNAL</text><text x="76" y="257" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.6" text-anchor="end">CONTROL</text><text x="76" y="401" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.6" text-anchor="end">NETWORK</text><text x="76" y="591" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.6" text-anchor="end">RUNTIME</text><text x="76" y="780" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.6" text-anchor="end">STORAGE</text><rect width="180" height="72" x="200" y="40" fill="#2F2620" stroke="#3F342C" stroke-width="1.5" rx="2"/><text x="290" y="74" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">firecrab-frontend</text><text x="290" y="94" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">React dashboard</text><rect width="180" height="72" x="400" y="40" fill="#2F2620" stroke="#3F342C" stroke-width="1.5" rx="2"/><text x="490" y="74" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">firecrab-cli</text><text x="490" y="94" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">terminal client</text><rect width="180" height="72" x="600" y="40" fill="#2F2620" stroke="#3F342C" stroke-width="1.5" rx="2"/><text x="690" y="74" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">REST client</text><text x="690" y="94" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">curl · scripts · CI</text><rect width="180" height="72" x="840" y="40" fill="#2F2620" stroke="#3F342C" stroke-width="1.5" rx="2"/><text x="930" y="74" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">Image registry</text><text x="930" y="94" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">OCI · M2Image source</text><rect width="650" height="98" x="140" y="204" fill="#2F2620" stroke="#F3EAE0" stroke-width="2.5" rx="2"/><text x="772" y="224" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing=".8" text-anchor="end">UNPRIVILEGED</text><text x="465" y="248" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" text-anchor="middle">firecrab-api</text><text x="465" y="269" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">REST + WebSocket · SQLite · Firecracker supervisor</text><text x="465" y="287" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">OCI / M2Image pull</text><rect width="330" height="100" x="140" y="347" fill="#3F291D" stroke="#F0824B" stroke-width="2.5" rx="2"/><text x="452" y="370" fill="#FFB088" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing=".8" text-anchor="end">CAPABILITY‑BOUNDED</text><text x="305" y="399" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">firecrab-helper</text><text x="305" y="421" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">bridge · TAP · nftables · dnsmasq</text><rect width="280" height="100" x="510" y="347" fill="#2F2620" stroke="#5C4C3F" stroke-width="1.5" rx="2"/><text x="650" y="387" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">MicroNetwork</text><text x="650" y="409" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">isolated bridge + subnet</text><rect width="880" height="190" x="140" y="492" fill="#1C1511" stroke="#3F342C" stroke-width="1.5" rx="8"/><rect width="243" height="118" x="175" y="528" fill="#2F2620" stroke="#5C4C3F" stroke-width="1.5" rx="2"/><text x="296" y="566" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">Guest VM 1</text><text x="296" y="590" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">Firecracker process</text><text x="296" y="610" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">KVM · TAP · rootfs</text><rect width="243" height="118" x="443" y="528" fill="#2F2620" stroke="#5C4C3F" stroke-width="1.5" rx="2"/><text x="564" y="566" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">Guest VM 2</text><text x="564" y="590" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">Firecracker process</text><text x="564" y="610" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">KVM · TAP · rootfs</text><text x="713" y="592" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">⋯</text><rect width="243" height="118" x="741" y="528" fill="#2F2620" stroke="#3F342C" stroke-width="1.5" rx="2"/><text x="862" y="576" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">Guest VM N</text><text x="862" y="600" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">one process per microVM</text><rect width="880" height="105" x="140" y="724" fill="#1C1511" stroke="#5C4C3F" stroke-width="1.5" rx="2"/><text x="170" y="759" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="start">MicroStorage</text><text x="170" y="780" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start">on the host disk</text><line x1="560" x2="560" y1="742" y2="812" stroke="#5C4C3F" stroke-width="1"/><line x1="790" x2="790" y1="742" y2="812" stroke="#5C4C3F" stroke-width="1"/><text x="390" y="759" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="start">VM images</text><text x="390" y="780" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start">kernels + rootfs</text><text x="390" y="800" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="start">images/</text><text x="590" y="759" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="start">VM disks</text><text x="590" y="780" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start">one writable disk per VM</text><text x="590" y="800" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="start">data/vms/&lt;id&gt;/</text><text x="820" y="759" fill="#F3EAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="start">State</text><text x="820" y="780" fill="#B3A18F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start">which VMs and networks exist</text><text x="820" y="800" fill="#B3A18F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="start">data/firecrab.db</text><path fill="none" stroke="#A08B7A" stroke-width="2.2" marker-end="url(#arrow)" d="M290,112 L290,204"/><path fill="none" stroke="#A08B7A" stroke-width="2.2" marker-end="url(#arrow)" d="M490,112 L490,204"/><path fill="none" stroke="#A08B7A" stroke-width="2.2" marker-end="url(#arrow)" d="M690,112 L690,204"/><path fill="none" stroke="#A08B7A" stroke-width="2.2" marker-end="url(#arrow)" d="M930,112 L930,136 L760,136 L760,204"/><path fill="none" stroke="#F0824B" stroke-width="2.2" marker-end="url(#arrow-accent)" d="M300,302 L300,347"/><path fill="none" stroke="#F0824B" stroke-width="2.2" marker-end="url(#arrow-accent)" d="M470,397 L510,397"/><path fill="none" stroke="#A08B7A" stroke-width="2.2" marker-end="url(#arrow)" d="M650,447 L650,492"/><path fill="none" stroke="#A08B7A" stroke-width="2.2" marker-end="url(#arrow)" d="M790,253 L900,253 L900,492"/><path fill="none" stroke="#A08B7A" stroke-width="2.2" marker-end="url(#arrow)" d="M140,253 L118,253 L118,776 L140,776"/><path fill="none" stroke="#A08B7A" stroke-widt