<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" aria-label="VM lifetime: the network helper runs each VM's firecrab-vm shim in its own systemd unit, so the VM survives API restarts and is re-attached over shim.sock; a stop from outside the API is recorded as stopped. At startup the API re-adopts running VMs, finishes interrupted stops, kills interrupted starts as errors, and settles the rest from exit.json." data-theme="light" role="img" viewBox="0 0 1200 640" style="background:#fff"><style>:root{--bg:#F3F5F7;--surface:#FFFFFF;--ink:#17212B;--muted:#56636F;--line:#C3CDD7;--host-bg:#E8EDF2;--host-line:#B2BFCB;--vm-bg:#DBE8F8;--vm-line:#3A6EB5;--fc-bg:#FCE5D2;--fc-line:#C8611F;--warn:#B42318;--font-body:&apos;IBM Plex Sans KR&apos;, &apos;Apple SD Gothic Neo&apos;, &apos;Noto Sans KR&apos;, &apos;Malgun Gothic&apos;, system-ui, sans-serif;--font-mono:&apos;IBM Plex Mono&apos;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--c-client:#232F3E;--c-control:#3B48CC;--c-compute:#ED7100;--c-storage:#6B8E12;--c-network:#8C4FFF;--c-manager:#0B8F7A;--badge-bg:#232F3E;--badge-fg:#FFFFFF;--c-macos:#1D1D1F;--c-linux:#FFFFFF;--c-linux-line:#AEB9C4;--c-security:#DD344C}svg .sm{font-family:var(--font-mono);font-size:11.5px;fill:var(--muted)}svg .w{font-size:12px;font-weight:500;fill:var(--warn)}svg .a{font-size:12px;fill:var(--ink)}svg rect{stroke-width:1.2}svg .chip{fill:var(--surface);stroke:var(--line)}svg .none{fill:none;stroke:var(--muted);stroke-dasharray:5 4}svg .warnbox{fill:var(--surface);stroke:var(--warn);stroke-dasharray:5 4;stroke-width:1.4}svg .edge{fill:none;stroke:var(--ink);stroke-width:1.5}svg .mk{fill:var(--ink)}svg .tile{stroke:none}svg .c-control{fill:var(--c-control)}svg .c-compute{fill:var(--c-compute)}svg .gl{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}svg .g-dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4}svg .g-comp{stroke:var(--c-compute)}svg .g-ctrl{stroke:var(--c-control)}svg .tl{font-size:13px;font-weight:500}svg .ts{font-size:12px;fill:var(--muted)}svg .gt{font-size:14px;font-weight:600}svg .c-security{fill:var(--c-security)}svg .dashed{stroke-dasharray:5 4}</style><defs><marker id="arw-v-en" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker></defs><rect width="1140" height="270" x="30" y="30" class="g-dash g-comp" rx="6"/><text x="42" y="52" class="gt" text-anchor="start">Every VM runs in its own systemd unit</text><rect width="160" height="150" x="50" y="70" class="none" rx="6"/><text x="60" y="90" class="sm" text-anchor="start">firecrab-api.service</text><rect width="56" height="56" x="102" y="112" class="tile c-control" rx="6"/><g class="gl" transform="translate(130 140) scale(1.2000) translate(-12 -12)" style="stroke-width:1.67px"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="130" y="186" class="tl" text-anchor="middle">firecrab-api</text><text x="130" y="203" class="ts" text-anchor="middle">unprivileged</text><rect width="56" height="56" x="247" y="112" class="tile c-security" rx="6"/><g class="gl" style="stroke-width:1.67px"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" transform="translate(275 140) scale(1.2000) translate(-12 -12)"/></g><text x="275" y="186" class="tl" text-anchor="middle">net-helper</text><text x="275" y="203" class="ts" text-anchor="middle">StartVmUnit</text><rect width="230" height="150" x="340" y="70" class="none" rx="6"/><text x="350" y="90" class="sm" text-anchor="start">firecrab-vm-&lt;id&gt;.service</text><rect width="56" height="56" x="370" y="112" class="tile c-compute" rx="6"/><g class="gl" style="stroke-width:1.67px"><path d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z" transform="translate(398 140) scale(1.2000) translate(-12 -12)"/><path d="M10 21.9V14L2.1 9.1" transform="translate(398 140) scale(1.2000) translate(-12 -12)"/><path d="m10 14 11.9-6.9" transform="translate(398 140) scale(1.2000) translate(-12 -12)"/><path d="M14 19.8v-8.1" transform="translate(398 140) scale(1.2000) translate(-12 -12)"/><path d="M18 17.5V9.4" transform="translate(398 140) scale(1.2000) translate(-12 -12)"/></g><text x="398" y="186" class="tl" text-anchor="middle">firecrab-vm</text><text x="398" y="203" class="ts" text-anchor="middle">API user</text><rect width="56" height="56" x="480" y="112" class="tile c-compute" rx="6"/><g class="gl" style="stroke-width:1.67px"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" transform="translate(508 140) scale(1.2000) translate(-12 -12)"/></g><text x="508" y="186" class="tl" text-anchor="middle">Firecracker</text><text x="508" y="203" class="ts" text-anchor="middle">child of the shim</text><path marker-end="url(#arw-v-en)" d="M158 140 H247" class="edge"/><path marker-end="url(#arw-v-en)" d="M303 140 H370" class="edge"/><text x="320" y="130" class="a" text-anchor="middle">run</text><path marker-end="url(#arw-v-en)" d="M426 140 H480" class="edge"/><path marker-end="url(#arw-v-en)" marker-start="url(#arw-v-en)" d="M130 220 V240 H398 V220" class="edge dashed"/><text x="264" y="256" class="a" text-anchor="middle">shim.sock · console, stop, exit</text><text x="610" y="100" class="tl" text-anchor="start">API restart or upgrade</text><text x="610" y="118" class="ts" text-anchor="start">the VM keeps running in its unit; startup re-attaches over shim.sock</text><text x="610" y="152" class="tl" text-anchor="start">systemctl stop of the unit, host shutdown</text><text x="610" y="170" class="ts" text-anchor="start">the shim stops its VM and records stop_requested → stopped</text><text x="610" y="204" class="tl" text-anchor="start">Shim or Firecracker killed</text><text x="610" y="222" class="ts" text-anchor="start">the unit ends with them; the exit (or its absence) → error</text><text x="610" y="256" class="tl" text-anchor="start">Start right after a stop</text><text x="610" y="274" class="ts" text-anchor="start">the helper clears the previous unit of the same name first</text><rect width="1140" height="280" x="30" y="330" class="g-dash g-ctrl" rx="6"/><text x="42" y="352" class="gt" text-anchor="start">API startup: settle every VM the database calls active</text><rect width="170" height="44" x="50" y="420" class="chip" rx="6"/><text x="135" y="439" class="tl" text-anchor="middle">Active record</text><text x="135" y="456" class="ts" text-anchor="middle">starting · running · stopping</text><path marker-end="url(#arw-v-en)" d="M220 442 H250" class="edge"/><rect width="150" height="44" x="250" y="420" class="chip" rx="6"/><text x="325" y="439" class="tl" text-anchor="middle">Shim answers?</text><text x="325" y="456" class="ts" text-anchor="middle">on shim.sock</text><path marker-end="url(#arw-v-en)" d="M325 420 V385 H440" class="edge"/><text x="410" y="378" class="a" text-anchor="middle">yes</text><rect width="160" height="40" x="440" y="365" class="chip" rx="6"/><text x="520" y="389.5" class="a" text-anchor="middle">running → re-adopt</text><rect width="230" height="40" x="612" y="365" class="chip" rx="6"/><text x="727" y="389.5" class="a" text-anchor="middle">stopping → re-adopt, finish the stop</text><rect width="190" height="40" x="854" y="365" class="warnbox" rx="6"/><text x="949" y="389.5" class="w" text-anchor="middle">starting → kill → error</text><path marker-end="url(#arw-v-en)" d="M325 464 V505 H440" class="edge"/><text x="410" y="498" class="a" text-anchor="middle">no</text><rect width="110" height="40" x="440" y="485" class="chip" rx="6"/><text x="495" y="509.5" class="tl" text-anchor="middle">exit.json</text><path marker-end="url(#arw-v-en)" d="M550 505 H566" class="edge"/><rect width="210" height="40" x="566" y="485" class="chip" rx="6"/><text x="671" y="509.5" class="a" text-anchor="middle">clean or requested → stopped</text><rect width="130" height="40" x="788" y="485" class="warnbox" rx="6"/><text x="853" y="509.5" class="w" text-anchor="middle">crash → error</text><rect width="190" height="40" x="930" y="485" class="chip" rx="6"/><text x="1025" y="509.5" class="a" text-anchor="middle">missing → stopped</text><text x="50" y="566" class="a" text-anchor="start">Every VM not re-adopted has its unit stopped and loses its TAP and firewall policy; networks, policies, and re-adopted TAPs are then re-applied.</text><text x="50" y="588" class="ts" text-anchor="start">A shim that answers but cannot be attached (another protocol version) is stopped through the helper; units with no re-adopted VM are only logged.</text></svg>